# Test-only configuration: bootutil ECDSA P-256 verification (PSA Crypto backend, MbedTLS 4.x).
CONFIG_ZTEST=y
CONFIG_ASSERT=y
# Third-party TF-PSA-Crypto trips -Werror (unused parameters) on this toolchain.
CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
CONFIG_LOG=y
# MCUboot selects the flash map; give it a flash driver on native_sim.
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y

CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_PSA=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_BOOT_IMG_HASH_ALG_SHA256=y

# Upstream MCUboot 2.5.0 key list: root keypair first, then public-only PEMs.
# All entries must share one signature type (P-256 here).
# Paths are relative to this test directory (APPLICATION_CONFIG_DIR).
CONFIG_BOOT_SIGNATURE_KEY_FILE="../../../bootloader/mcuboot/root-ec-p256.pem,../../app/dmc/sysbuild/test-keys/p256/test-key-a-p256.pub.pem,../../app/dmc/sysbuild/test-keys/p256/test-key-b-p256.pub.pem"
