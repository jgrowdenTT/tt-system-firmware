CONFIG_ZTEST=y
CONFIG_PRINTK=y
# The launcher spins in k_busy_wait() on the test thread, so the test thread must be preemptible
# for the host thread (cooperative, higher priority) to run. The ztest default is cooperative.
CONFIG_ZTEST_THREAD_PRIORITY=10

# The BL1 image's configuration. The minimal overlay leaves ram0 at the board default, so the
# default stack sizes fit, and coverage needs them.
CONFIG_SENSOR=n
CONFIG_FLASH=n
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_MBOX=y
# The gr_smc library is left out, and with it the real gr_smc_jump_to(). The test defines its own
# fake, which returns, so the jump is not compiled as noreturn.
CONFIG_TT_GR_SMC=n
CONFIG_GR_SMC_JUMP_TO=n
# Logging is off here: the log buffers do not fit alongside ztest in the BL1 RAM region, and the
# tests check behaviour, not log output.
CONFIG_LOG=n
