CONFIG_ZTEST=y
CONFIG_PRINTK=y
# Without userspace, mbox_send() and mbox_set_enabled() call extern z_impl_* functions, which
# the test defines as FFF fakes. The syscall handlers that would define them are not built.
CONFIG_USERSPACE=n
CONFIG_MBOX=y
CONFIG_SENSOR=n
CONFIG_FLASH=n
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_MP_MAX_NUM_CPUS=1
# gr_smc is not built, so gr_smc_get_chipid() and gr_smc_jump_to() are FFF fakes. The jump is
# declared to return, as the fake does.
CONFIG_TT_GR_SMC=n
CONFIG_GR_SMC_JUMP_TO=n
# As in the keraunos BL1 test: the log buffers do not fit with ztest in BL1 RAM.
CONFIG_LOG=n
