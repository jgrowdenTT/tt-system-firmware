# Hardware map for twister device testing on a Grendel PCIe device, for both topologies:
#   tt_mmk     Keraunos (k0) and Mimir (m0); m1 is left free for k0 tests (e.g. remoteproc) to boot and corrupt
#   tt_qsr1a1  Keraunos (k0), Mimir (m0) and Quasar (q0)
# Twister only uses the entries whose platform is selected with -p. The device must be built with the
# matching topology; running tt_qsr1a1 tests on an MMK-topology device (or vice versa) crashes it.
#
# Use scripts/run-gr-twister.sh <mmk|qsr1a1>, or from the west workspace root:
#   twister --device-testing --hardware-map tt-system-firmware/test-conf/hwmap-grendel.yaml \
#           -T zephyr/tests --alt-config-root tt-system-firmware/test-conf/tests \
#           -p tt_mmk/tt_keraunos/smc -p tt_mmk/tt_mimir/smc -s <test.id>
# run-gr-twister.sh also passes --flash-command scripts/gr_pcie_flash.py, which does the same reset/load
# as the gr_pcie_gdb runner without west's startup cost, taking the target from the entry id's suffix
# (mmk-k0 -> k0). The runner/runner_params below then only apply to plain twister and `west flash`.
#
# Each test: The gr_pcie_gdb runner (or gr_pcie_flash.py) holds the SMC in reset, loads the image at the reset
# vector, releases it and waits for the VUART; tt_keraunos_console.py then attaches as the serial port.
# flash_before is required: the console can only attach once the image has published its VUART.
# Paths below assume tt-system-firmware lives at ~/tt-system-firmware-work/tt-system-firmware.

# tt_mmk
- id: "mmk-k0"
  product: mmk-keraunos
  platform:
    - tt_mmk/tt_keraunos/smc
  connected: true
  runner: gr_pcie_gdb
  runner_params:
    - "--target=k0"
    - "--device-id=0"
    - "--vuart-timeout=30"
  serial_pty: "/home/ubuntu/tt-system-firmware-work/tt-system-firmware/scripts/tt_keraunos_console.py,k,0,--also,m1"
  serial_baud: 115200
  flash_before: true
  flash_timeout: 120

- id: "mmk-m0"
  product: mmk-mimir
  platform:
    - tt_mmk/tt_mimir/smc
  connected: true
  runner: gr_pcie_gdb
  runner_params:
    - "--target=m0"
    - "--device-id=0"
    - "--vuart-timeout=30"
  serial_pty: "/home/ubuntu/tt-system-firmware-work/tt-system-firmware/scripts/tt_keraunos_console.py,m0,0"
  serial_baud: 115200
  flash_before: true
  flash_timeout: 120

