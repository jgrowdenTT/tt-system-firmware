SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y

# TEST ONLY: ECDSA P-256 for the DMC. All keys in the bootloader list must use
# the same signature type. Bootloader accepts the root key plus two test public
# keys. Paths resolve against mcuboot's boot/zephyr dir, then the mcuboot root.
# Not for release builds.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOTLOADER_SIGNATURE_KEY_FILES="root-ec-p256.pem,../../../../tt-system-firmware/app/dmc/sysbuild/test-keys/p256/test-key-a-p256.pub.pem,../../../../tt-system-firmware/app/dmc/sysbuild/test-keys/p256/test-key-b-p256.pub.pem"
