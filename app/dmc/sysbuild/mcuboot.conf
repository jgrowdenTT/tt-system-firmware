# Always clear the segger RTT control block on boot
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y
# This is required to speed-up boot times for bootrom patching
CONFIG_BOOT_VALIDATE_SLOT0=n
CONFIG_BOOT_SWAP_USING_OFFSET=y
CONFIG_BOOT_BOOTSTRAP=y

# The bootloader's verification key list is set in app/dmc/sysbuild.conf
# (SB_CONFIG_BOOTLOADER_SIGNATURE_KEY_FILES). Sysbuild overrides this file for
# that option, so it must not be set here.
