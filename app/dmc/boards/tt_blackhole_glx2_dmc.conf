# GLX2 board does not have max6639 fan controller, so disable MFD and PWM
CONFIG_MFD=n
CONFIG_PWM=n

CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"

# Enable shell over RTT. The shell and the RTT log backend cannot share
# RTT channel 0, so route logs through the shell instead. give shell priority so early init
# logs are posted.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_PROMPT_RTT="glx2-dmc:~$ "
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=-1

#CONFIG_TT_JTAG_BOOTROM_LOG_LEVEL_DBG=y

CONFIG_GPIO_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_I3C_SHELL=y
CONFIG_SPI_SHELL=y
CONFIG_FLASH_SHELL=y
CONFIG_LOG_CMDS=y
# CONFIG_JTAG_LOAD_ON_PRESET=n
